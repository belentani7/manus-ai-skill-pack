name: Build
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Drive import scripts and tests
        run: |
          python -m py_compile \
            abcnuts-autonomous-github-sync/scripts/gdrive_to_repo_sync.py \
            abcnuts-autonomous-sync-script/scripts/gdrive_to_repo_sync.py \
            tests/test_safe_gdrive_sync.py
      - name: Test offline Drive import safety
        run: python -m unittest discover -s tests -p 'test_*.py' -v
